version: '3'

env:
  OPENBLAS_NUM_THREADS: '1'

tasks:
  default:
    desc: Build the manuscript.
    aliases: [all]
    cmds:
      - task: paper

  package:
    desc: Package the paper, experiments, saved results, and environment in build/.
    aliases: [package-code]
    cmds:
      - |
        release_output=$(devenv build outputs.release | python -c 'import json, sys; print(json.load(sys.stdin)["outputs.release"])')
        mkdir -p build
        install -m 644 "$release_output"/*.tar.gz build/

  review:package:
    desc: Create an anonymous review supplement from the complete release archive.
    vars:
      REVIEW_VERSION:
        sh: python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
    cmds:
      - task: package
      - >-
        python -m scripts.package_review
        'build/normreg-multi-{{.REVIEW_VERSION}}.tar.gz'
        'build/normreg-multi-review-{{.REVIEW_VERSION}}.tar.gz'

  check:packages:
    desc: Build and inspect release and review archives for reproduction contents.
    vars:
      RELEASE_VERSION:
        sh: python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
    cmds:
      - task: review:package
      - python -m checks.packaging 'build/normreg-multi-{{.RELEASE_VERSION}}.tar.gz'
      - python -m checks.packaging 'build/normreg-multi-review-{{.RELEASE_VERSION}}.tar.gz' --review

  container:build:
    desc: Build the experiment image with the release contents and dependencies.
    cmds:
      - devenv container build experiments

  container:load:
    desc: Build the experiment image and load it into local Docker.
    cmds:
      - devenv container copy experiments

  container:publish:
    desc: Publish the experiment image to an explicit REGISTRY destination.
    requires:
      vars: [REGISTRY]
    cmds:
      - devenv container copy experiments --registry '{{.REGISTRY}}'

  paper:
    desc: Build the manuscript figures and build/main.pdf.
    cmds:
      - task: figures
      - cd paper && latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=../build main.tex

  arxiv:
    desc: Build the preprint PDF and verified arXiv source bundle.
    cmds:
      - task: paper
      - python -m scripts.package_arxiv build/arxiv.tar.gz

  figures:
    desc: Export the manuscript figures to figures/.
    aliases: [paper-figures]
    cmds:
      - task: figure:intro
      - task: figure
        vars:
          SCRIPT: predictive_intro
          STUDY: predictive-intro
          SUMMARY: results/predictive-intro/summary.json
          NAME: tuned-rare-risk
      - task: figure
        vars:
          SCRIPT: tuned_decomposition
          STUDY: tuned-decomposition
          SUMMARY: results/predictive-intro/summary.json
          NAME: risk-components
      - task: figure:common-block
      - task: figure:oracle-finite
      - task: figure:theory-bridge

  figure:intro:
    desc: Plot the introductory subfigures and their shared legend.
    sources:
      - scripts/figures/plot_coefficient_paths.py
      - scripts/figures/plot_signal_crossing.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/coefficient-paths/summary.json
      - results/oracle-finite/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
      - uv.lock
    generates:
      - figures/coefficient-paths/paths-to-ols.pdf
      - figures/coefficient-paths/paths-to-ols.svg
      - figures/coefficient-paths/paths-to-ols.png
      - figures/coefficient-paths/method-legend.pdf
      - figures/coefficient-paths/method-legend.svg
      - figures/coefficient-paths/method-legend.png
      - figures/signal-crossing/risk-crossing.pdf
      - figures/signal-crossing/risk-crossing.svg
      - figures/signal-crossing/risk-crossing.png
    cmds:
      - python scripts/figures/plot_coefficient_paths.py
      - python -m scripts.figures.plot_signal_crossing

  figure:
    internal: true
    label: 'figure:{{.STUDY}}'
    sources:
      - Taskfile.yml
      - 'scripts/figures/plot_{{.SCRIPT}}.py'
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - '{{.SUMMARY}}'
      - '{{.EXTRA_SUMMARY | default .SUMMARY}}'
      - devenv.nix
      - devenv.lock
      - uv.lock
    generates:
      - 'figures/{{.STUDY}}/{{.NAME}}.pdf'
      - 'figures/{{.STUDY}}/{{.NAME}}.svg'
      - 'figures/{{.STUDY}}/{{.NAME}}.png'
    cmds:
      - 'python scripts/figures/plot_{{.SCRIPT}}.py'

  check:
    desc: Check formatting, configuration, calculations, and the paper.
    aliases: [check-quick]
    cmds:
      - task: check-markdown
      - task: check-config
      - task: check-python
      - task: check:figure-rendering
      - task: check-experiments
      - task: paper

  check-markdown:
    desc: Check Markdown formatting and lint.
    cmds:
      - panache format --check .
      - panache lint .

  check-config:
    desc: Check Nix formatting and the Python lockfile.
    cmds:
      - nixfmt --check devenv.nix nix/*.nix
      - uv lock --check

  check-python:
    desc: Check Python formatting and lint.
    cmds:
      - ruff format --check normreg experiments checks scripts
      - ruff check normreg experiments checks scripts

  check-experiments:
    desc: Check mathematical identities, numerical updates, and selections.
    cmds:
      - task: check:moments
      - task: check:predictive-theorem
      - task: check:predictive-fixed-q
      - task: check:predictive-review
      - task: check:oracle-limits
      - task: check:illustrations
      - task: check:workflow
      - task: check:theory-bridge
      - task: check:calibration-sensitivity
      - task: check:exact-calibration
      - task: check:selection-gains
      - task: check:risk-decomposition
      - task: check:common-block

  check:common-block:
    desc: Check the common-block reduction, dimension search, and fixed-rate limits.
    cmds:
      - 'python -m checks.common_block {{.CLI_ARGS}}'
      - python -m experiments.common_block.summarize --check

  check:theory-bridge:
    desc: Check independent dynamics, risks, and selections for the bridge study.
    cmds:
      - python -m checks.theory_bridge

  check:calibration-sensitivity:
    desc: Check disjoint recalibration and reconstruct its saved sensitivity results.
    cmds:
      - python -m checks.calibration_sensitivity
      - python -m experiments.theory_bridge.calibration_sensitivity --check

  check:selection-gains:
    desc: Verify paired selection gains and saved predictor errors.
    cmds:
      - python -m checks.selection_gains
      - python -m experiments.theory_bridge.selection_gains --check

  check:exact-calibration:
    desc: Verify exact expected-risk calibration by enumeration and saved moments.
    cmds:
      - python -m checks.exact_calibration
      - python -m experiments.theory_bridge.exact_calibration --check

  check:risk-decomposition:
    desc: Verify rare-risk terms and intercept cancellation from saved predictors.
    cmds:
      - python -m checks.risk_decomposition
      - python -m experiments.theory_bridge.risk_decomposition --check

  check:moments:
    desc: Check moments calculations.
    cmds:
      - python -m checks.joint_interactions

  check:predictive-theorem:
    desc: Check predictive theorem calculations.
    cmds:
      - python -m checks.predictive_theorem

  check:predictive-review:
    desc: Check predictive review calculations.
    cmds:
      - python -m checks.predictive_review

  check:predictive-fixed-q:
    desc: Certify the oracle gaps at fixed positive prevalence.
    cmds:
      - python -m checks.predictive_fixed_q

  check:oracle-limits:
    desc: Check the oracle limits, uniform control, and variational comparison.
    cmds:
      - python -m checks.oracle_limits
      - python -m checks.oracle_infima
      - task: check:oracle-variational
      - task: check:oracle-finite

  check:oracle-variational:
    desc: Check the limiting oracle comparison across signals, noise, and budgets.
    cmds:
      - python -m checks.oracle_variational

  check:oracle-finite:
    desc: Replay finite-prevalence risks and limiting predictions (-- --rerun for full searches).
    cmds:
      - python -m checks.reproduction
      - 'python -m checks.oracle_finite {{.CLI_ARGS}}'

  check:illustrations:
    desc: Check the numerical data used in the illustrations.
    cmds:
      - python -m experiments.coefficient_paths.run --check
      - python -m experiments.predictive_intro.run --check

  check:workflow:
    desc: Check experiment entry points and a small saved run.
    cmds:
      - python -m checks.workflow

  check:figure-rendering:
    desc: Check LaTeX text rendering in PDF, SVG, and PNG figures.
    cmds:
      - python -m checks.figure_rendering

  check:results:
    desc: Reconstruct saved manuscript risks, selections, summaries, and diagnostics.
    cmds:
      - task: check:illustrations
      - task: check:oracle-finite
      - python -m checks.common_block --saved
      - python -m experiments.common_block.summarize --check
      - python -m checks.theory_bridge --saved
      - python -m experiments.theory_bridge.summarize --check
      - task: check:calibration-sensitivity
      - task: check:exact-calibration
      - task: check:selection-gains
      - task: check:risk-decomposition

  experiment:predictive-intro:
    desc: Compute the introduction illustration.
    cmds:
      - python -m experiments predictive-intro

  experiment:theory-bridge:
    desc: Run and summarize controlled departures from the oracle model.
    cmds:
      - 'python -m experiments theory-bridge'

  experiment:theory-bridge:run:
    desc: Run independent calibration and evaluation for the bridge study.
    cmds:
      - 'python -m experiments.theory_bridge.run {{.CLI_ARGS}}'

  experiment:theory-bridge:summarize:
    desc: Summarize the saved bridge study without retraining.
    cmds:
      - python -m experiments.theory_bridge.summarize

  experiment:calibration-sensitivity:
    desc: Recalibrate and evaluate on disjoint halves of saved calibration shards.
    cmds:
      - python -m experiments calibration-sensitivity

  experiment:selection-gains:
    desc: Analyze selection gains from saved fresh-arm predictors without training.
    cmds:
      - python -m experiments selection-gains

  experiment:exact-calibration:
    desc: Compute exact expected-risk benchmarks for the saved fresh-arm candidates.
    cmds:
      - python -m experiments exact-calibration

  experiment:risk-decomposition:
    desc: Decompose saved fresh-arm rare risks and measure cancellation without training.
    cmds:
      - python -m experiments risk-decomposition

  figure:theory-bridge:
    desc: Plot the saved controlled comparisons and validation selections.
    sources:
      - scripts/figures/plot_theory_bridge.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/theory-bridge/summary.json
      - results/theory-bridge/selection-gains.npz
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
    generates:
      - figures/theory-bridge/controlled-gaps.pdf
      - figures/theory-bridge/controlled-gaps.svg
      - figures/theory-bridge/controlled-gaps.png
      - figures/theory-bridge/validation-gaps.pdf
      - figures/theory-bridge/validation-gaps.svg
      - figures/theory-bridge/validation-gaps.png
      - figures/theory-bridge/selection-gains.pdf
      - figures/theory-bridge/selection-gains.svg
      - figures/theory-bridge/selection-gains.png
    cmds:
      - python scripts/figures/plot_theory_bridge.py

  experiment:coefficient-paths:
    desc: Compute the introductory full-gradient paths to OLS.
    cmds:
      - python -m experiments coefficient-paths

  experiment:common-block:
    desc: Run and summarize one rare feature with a growing common block.
    cmds:
      - 'python -m experiments common-block'

  experiment:common-block:run:
    desc: Compute exact-moment searches over common-feature dimension.
    cmds:
      - python -m experiments.common_block.run

  experiment:common-block:summarize:
    desc: Summarize saved common-block searches without new trajectories.
    cmds:
      - python -m experiments.common_block.summarize

  figure:common-block:
    desc: Plot the saved common-feature dimension comparisons.
    sources:
      - scripts/figures/plot_common_block.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/common-block/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
    generates:
      - figures/common-block/budget-slice.pdf
      - figures/common-block/budget-slice.svg
      - figures/common-block/budget-slice.png
      - figures/common-block/dimension-gaps.pdf
      - figures/common-block/dimension-gaps.svg
      - figures/common-block/dimension-gaps.png
    cmds:
      - python scripts/figures/plot_common_block.py

  experiment:oracle-finite:
    desc: Compute and summarize exact finite-prevalence comparisons with the limits.
    cmds:
      - 'python -m experiments oracle-finite'

  experiment:oracle-finite:run:
    desc: Search nested rate and stop grids using exact moments.
    cmds:
      - python -m experiments.oracle_finite.run

  experiment:oracle-finite:summarize:
    desc: Compare saved finite-prevalence risks with the limiting formulas.
    cmds:
      - python -m experiments.oracle_finite.summarize

  figure:oracle-finite:
    desc: Plot saved finite-prevalence comparisons and limiting predictions.
    sources:
      - scripts/figures/plot_oracle_finite.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/oracle-finite/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
      - uv.lock
    generates:
      - figures/oracle-finite/convergence.pdf
      - figures/oracle-finite/convergence.svg
      - figures/oracle-finite/convergence.png
      - figures/oracle-finite/allocation.pdf
      - figures/oracle-finite/allocation.svg
      - figures/oracle-finite/allocation.png
      - figures/oracle-finite/noise.pdf
      - figures/oracle-finite/noise.svg
      - figures/oracle-finite/noise.png
      - figures/oracle-finite/budget.pdf
      - figures/oracle-finite/budget.svg
      - figures/oracle-finite/budget.png
    cmds:
      - python scripts/figures/plot_oracle_finite.py

  prepare-lean:
    desc: Fetch the Mathlib caches needed by the proofs.
    dir: lean
    cmds:
      - lake exe cache get Mathlib.Algebra.Ring.GeomSum Mathlib.Data.Real.Archimedean Mathlib.Data.Real.Basic Mathlib.Tactic.FieldSimp Mathlib.Tactic.Linarith Mathlib.Tactic.Positivity Mathlib.Tactic.Ring

  check-lean:
    desc: Build the formal proofs and axiom audits.
    dir: lean
    cmds:
      - lake build

  format:
    desc: Format Markdown, Nix, and Python sources.
    cmds:
      - panache format .
      - nixfmt devenv.nix nix/*.nix
      - ruff format normreg experiments checks scripts
