version: '3'

env:
  OPENBLAS_NUM_THREADS: '1'

tasks:
  default:
    desc: Build the manuscript.
    aliases: [all]
    cmds:
      - task: paper

  package:
    desc: Package the paper, experiments, saved results, and environment in build/.
    aliases: [package-code]
    cmds:
      - |
        release_output=$(devenv build outputs.release | python -c 'import json, sys; print(json.load(sys.stdin)["outputs.release"])')
        mkdir -p build
        install -m 644 "$release_output"/*.tar.gz build/

  review:
    desc: Build the paper and source supplement, then run private AISTATS mock reviews.
    vars:
      REVIEW_OUTPUT:
        sh: date +reviews/aistats-%Y%m%d-%H%M%S
      RELEASE_VERSION:
        sh: python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
    cmds:
      - task: paper
      - task: package
      - >-
        {{.REVIEWER | default "codex-aistats-review"}}
        --paper build/main.pdf
        --supplement-archive 'build/normreg-multi-{{.RELEASE_VERSION}}.tar.gz'
        --output '{{.OUTPUT | default .REVIEW_OUTPUT}}'
        {{.CLI_ARGS}}

  container:build:
    desc: Build the experiment image with the release contents and dependencies.
    cmds:
      - devenv container build experiments

  container:load:
    desc: Build the experiment image and load it into local Docker.
    cmds:
      - devenv container copy experiments

  container:publish:
    desc: Publish the experiment image to an explicit REGISTRY destination.
    requires:
      vars: [REGISTRY]
    cmds:
      - devenv container copy experiments --registry '{{.REGISTRY}}'

  paper:
    desc: Build the manuscript figures and build/main.pdf.
    cmds:
      - task: figures
      - cd paper && latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=../build main.tex

  figures:
    desc: Export the manuscript figures to figures/.
    aliases: [paper-figures]
    cmds:
      - task: figure:intro
      - task: figure
        vars:
          SCRIPT: predictive_intro
          STUDY: predictive-intro
          SUMMARY: results/predictive-intro/summary.json
          NAME: tuned-rare-risk
      - task: figure
        vars:
          SCRIPT: tuned_decomposition
          STUDY: tuned-decomposition
          SUMMARY: results/predictive-intro/summary.json
          NAME: risk-components
      - task: figure
        vars:
          SCRIPT: signal_allocation
          STUDY: signal-allocation
          SUMMARY: results/signal-allocation/summary.json
          NAME: risk-map
      - task: figure:common-block
      - task: figure:theory-bridge
      - task: figure
        vars:
          SCRIPT: mushroom_final
          STUDY: mushroom-final
          SUMMARY: results/mushroom/rates25/mushroom-summary-c1.json
          EXTRA_SUMMARY: results/diagnostics/summary.json
          NAME: selected-risks
      - task: figure
        vars:
          SCRIPT: practical_selection
          STUDY: practical-selection
          SUMMARY: results/synthetic/rates5/summary.json
          EXTRA_SUMMARY: results/mushroom/rates5/summary.json
          NAME: practical-selection
      - task: figure
        vars:
          SCRIPT: mushroom_rate_search
          STUDY: mushroom-rate-search
          SUMMARY: results/mushroom/rates17/summary.json
          NAME: paths-n2048-aggregate

  figure:intro:
    desc: Plot the introductory subfigures and their shared legend.
    sources:
      - scripts/figures/plot_coefficient_paths.py
      - scripts/figures/plot_signal_crossing.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/coefficient-paths/summary.json
      - results/signal-allocation/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
      - uv.lock
    generates:
      - figures/coefficient-paths/paths-to-ols.pdf
      - figures/coefficient-paths/paths-to-ols.svg
      - figures/coefficient-paths/paths-to-ols.png
      - figures/coefficient-paths/method-legend.pdf
      - figures/coefficient-paths/method-legend.svg
      - figures/coefficient-paths/method-legend.png
      - figures/signal-crossing/risk-crossing.pdf
      - figures/signal-crossing/risk-crossing.svg
      - figures/signal-crossing/risk-crossing.png
    cmds:
      - python scripts/figures/plot_coefficient_paths.py
      - python scripts/figures/plot_signal_crossing.py

  figure:
    internal: true
    label: 'figure:{{.STUDY}}'
    sources:
      - Taskfile.yml
      - 'scripts/figures/plot_{{.SCRIPT}}.py'
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - '{{.SUMMARY}}'
      - '{{.EXTRA_SUMMARY | default .SUMMARY}}'
      - devenv.nix
      - devenv.lock
      - uv.lock
    generates:
      - 'figures/{{.STUDY}}/{{.NAME}}.pdf'
      - 'figures/{{.STUDY}}/{{.NAME}}.svg'
      - 'figures/{{.STUDY}}/{{.NAME}}.png'
    cmds:
      - 'python scripts/figures/plot_{{.SCRIPT}}.py'

  check:
    desc: Check formatting, configuration, calculations, and the paper.
    aliases: [check-quick]
    cmds:
      - task: check-markdown
      - task: check-config
      - task: check-python
      - task: check-experiments
      - task: paper

  check-markdown:
    desc: Check Markdown formatting and lint.
    cmds:
      - panache format --check .
      - panache lint .

  check-config:
    desc: Check Nix, GitHub Actions, and the Python lockfile.
    cmds:
      - nixfmt --check devenv.nix nix/*.nix
      - actionlint .github/workflows/*.yml
      - uv lock --check

  check-python:
    desc: Check Python formatting and lint.
    cmds:
      - ruff format --check experiments checks scripts
      - ruff check experiments checks scripts

  check-experiments:
    desc: Check mathematical identities, numerical updates, and selections.
    cmds:
      - task: check:moments
      - task: check:normalization-risk
      - task: check:predictive-theorem
      - task: check:predictive-fixed-q
      - task: check:predictive-review
      - task: check:exact-risk
      - task: check:selection
      - task: check:mushroom-rates
      - task: check:mushroom-damping
      - task: check:matched-scaling
      - task: check:illustrations
      - task: check:workflow
      - task: check:theory-bridge
      - task: check:common-block

  check:common-block:
    desc: Check the common-block reduction, dimension search, and fixed-rate limits.
    cmds:
      - 'python -m checks.common_block {{.CLI_ARGS}}'

  check:theory-bridge:
    desc: Check independent dynamics, risks, and selections for the bridge study.
    cmds:
      - python -m checks.theory_bridge

  check:moments:
    desc: Check moments calculations.
    cmds:
      - python -m checks.joint_interactions

  check:normalization-risk:
    desc: Check normalization risk calculations.
    cmds:
      - python -m checks.normalization_risk_theorem

  check:predictive-theorem:
    desc: Check predictive theorem calculations.
    cmds:
      - python -m checks.predictive_theorem

  check:predictive-review:
    desc: Check predictive review calculations.
    cmds:
      - python -m checks.predictive_review

  check:predictive-fixed-q:
    desc: Certify the oracle gaps at fixed positive prevalence.
    cmds:
      - python -m checks.predictive_fixed_q

  check:exact-risk:
    desc: Check exact risk calculations.
    cmds:
      - python -m checks.normalization_robustness --numerics-only

  check:selection:
    desc: Check selection calculations.
    cmds:
      - python -m checks.practical_selection --numerics-only

  check:mushroom-rates:
    desc: Check mushroom rates calculations.
    cmds:
      - python -m checks.mushroom_rate_search --numerics-only

  check:mushroom-damping:
    desc: Check mushroom damping calculations.
    cmds:
      - python -m checks.mushroom_sensitivity --numerics-only

  check:matched-scaling:
    desc: Check matched scaling calculations.
    cmds:
      - python -m checks.variance_scaling --numerics-only

  check:illustrations:
    desc: Check the numerical data used in the illustrations.
    cmds:
      - python -m experiments.coefficient_paths.run --check
      - python -m experiments.predictive_intro.run --check
      - python -m experiments.signal_allocation.run --check

  check:workflow:
    desc: Check experiment entry points and a small saved run.
    cmds:
      - python -m checks.workflow

  check:results:
    desc: Reconstruct saved losses, selections, summaries, and diagnostics.
    cmds:
      - python -m checks.practical_selection
      - python -m checks.mushroom_rate_search
      - python -m checks.mushroom_sensitivity
      - python -m checks.variance_scaling
      - python -m experiments.diagnostics.run --check
      - python -m checks.theory_bridge --saved
      - python -m experiments.theory_bridge.summarize --check

  check:exact-risk-results:
    desc: Check the large exact-risk outputs after running that experiment.
    cmds:
      - python -m checks.normalization_robustness

  experiment:mushroom:
    desc: Run and summarize the mushroom experiment (-- --config NAME).
    cmds:
      - task: experiment:mushroom:run
        vars:
          ARGS: '{{.CLI_ARGS}}'
      - task: experiment:mushroom:summarize
        vars:
          ARGS: '{{.CLI_ARGS}}'

  experiment:mushroom:run:
    desc: Run the mushroom experiment (-- --config NAME).
    cmds:
      - 'python -m experiments.mushroom.run {{.ARGS | default .CLI_ARGS}}'

  experiment:mushroom:summarize:
    desc: Summarize the mushroom experiment (-- --config NAME).
    cmds:
      - 'python -m experiments.mushroom.summarize {{.ARGS | default .CLI_ARGS}}'

  experiment:synthetic:
    desc: Run and summarize the synthetic experiment (-- --config NAME).
    cmds:
      - task: experiment:synthetic:run
        vars:
          ARGS: '{{.CLI_ARGS}}'
      - task: experiment:synthetic:summarize
        vars:
          ARGS: '{{.CLI_ARGS}}'

  experiment:synthetic:run:
    desc: Run the synthetic experiment (-- --config NAME).
    cmds:
      - 'python -m experiments.synthetic.run {{.ARGS | default .CLI_ARGS}}'

  experiment:synthetic:summarize:
    desc: Summarize the synthetic experiment (-- --config NAME).
    cmds:
      - 'python -m experiments.synthetic.summarize {{.ARGS | default .CLI_ARGS}}'

  experiment:exact-risk:
    desc: Run and summarize the exact-risk comparisons.
    cmds:
      - task: experiment:exact-risk:run
      - task: experiment:exact-risk:summarize

  experiment:exact-risk:run:
    desc: Compute exact moments and paired simulations.
    cmds:
      - python -m experiments.exact_risk.run
      - python -m experiments.exact_risk.simulate

  experiment:exact-risk:summarize:
    desc: Summarize the saved exact-risk comparisons.
    cmds:
      - python -m experiments.exact_risk.summarize

  experiment:predictive-intro:
    desc: Compute the introduction illustration.
    cmds:
      - python -m experiments.predictive_intro.run

  experiment:theory-bridge:
    desc: Run and summarize controlled departures from the oracle model.
    cmds:
      - task: experiment:theory-bridge:run
      - task: experiment:theory-bridge:summarize

  experiment:theory-bridge:run:
    desc: Run independent calibration and evaluation for the bridge study.
    cmds:
      - 'python -m experiments.theory_bridge.run {{.CLI_ARGS}}'

  experiment:theory-bridge:summarize:
    desc: Summarize the saved bridge study without retraining.
    cmds:
      - python -m experiments.theory_bridge.summarize

  figure:theory-bridge:
    desc: Plot the saved controlled comparisons and validation selections.
    sources:
      - scripts/figures/plot_theory_bridge.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/theory-bridge/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
    generates:
      - figures/theory-bridge/controlled-gaps.pdf
      - figures/theory-bridge/controlled-gaps.svg
      - figures/theory-bridge/controlled-gaps.png
      - figures/theory-bridge/validation-gaps.pdf
      - figures/theory-bridge/validation-gaps.svg
      - figures/theory-bridge/validation-gaps.png
    cmds:
      - python scripts/figures/plot_theory_bridge.py

  experiment:coefficient-paths:
    desc: Compute the introductory full-gradient paths to OLS.
    cmds:
      - python -m experiments.coefficient_paths.run

  experiment:common-block:
    desc: Run and summarize one rare feature with a growing common block.
    cmds:
      - task: experiment:common-block:run
      - task: experiment:common-block:summarize

  experiment:common-block:run:
    desc: Compute exact-moment searches over common-feature dimension.
    cmds:
      - python -m experiments.common_block.run

  experiment:common-block:summarize:
    desc: Summarize saved common-block searches without new trajectories.
    cmds:
      - python -m experiments.common_block.summarize

  figure:common-block:
    desc: Plot the saved common-feature dimension comparisons.
    sources:
      - scripts/figures/plot_common_block.py
      - scripts/figures/style.py
      - scripts/figures/palette.toml
      - results/common-block/summary.json
      - Taskfile.yml
      - devenv.nix
      - devenv.lock
    generates:
      - figures/common-block/budget-slice.pdf
      - figures/common-block/budget-slice.svg
      - figures/common-block/budget-slice.png
      - figures/common-block/dimension-gaps.pdf
      - figures/common-block/dimension-gaps.svg
      - figures/common-block/dimension-gaps.png
    cmds:
      - python scripts/figures/plot_common_block.py

  experiment:signal-allocation:
    desc: Compute the signal-allocation illustration.
    cmds:
      - python -m experiments.signal_allocation.run

  experiment:diagnostics:
    desc: Reconstruct numerical discrepancies and compute post hoc diagnostics.
    cmds:
      - python -m checks.variance_scaling --write-audit
      - python -m experiments.diagnostics.run --update-paper

  experiment:precision:
    desc: Replay selected synthetic paths at 160-digit precision.
    cmds:
      - python -m experiments.precision.run

  prepare-lean:
    desc: Fetch the Mathlib caches needed by the proofs.
    dir: lean
    cmds:
      - lake exe cache get Mathlib.Data.Real.Basic Mathlib.Tactic.FieldSimp Mathlib.Tactic.Linarith Mathlib.Tactic.Positivity Mathlib.Tactic.Ring

  check-lean:
    desc: Build the formal proofs and axiom audits.
    dir: lean
    cmds:
      - lake build

  format:
    desc: Format Markdown, Nix, and Python sources.
    cmds:
      - panache format .
      - nixfmt devenv.nix nix/*.nix
      - ruff format experiments checks scripts
