[project]
name = "normreg-multi"
version = "0.1.0"
description = "Research on normalization and shrinkage with correlated binary features"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

