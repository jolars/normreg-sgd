# Edit these values to change the palette; edit the tables below to reassign it.
# Categorical colors follow Okabe and Ito: https://jfly.uni-koeln.de/color/
# Ordered factors sample viridis and plasma, avoiding their palest endpoints.
[colors]
blue = "#0072B2"
vermilion = "#D55E00"
green = "#009E73"
purple = "#CC79A7"
orange = "#E69F00"
sky_blue = "#56B4E9"
yellow = "#F0E442"
black = "#000000"
gray = "#888888"
charcoal = "#555555"
dark_gray = "#222222"
viridis_low = "#463480"
viridis_mid = "#21918C"
viridis_high = "#7AD151"
plasma_low = "#5601A4"
plasma_mid = "#CC4778"
plasma_high = "#FCA636"

[defaults]
cycle = ["blue", "vermilion", "green", "purple", "orange", "sky_blue", "black"]
risk_colormap = "RdBu_r"
bar_edgecolor = "charcoal"

# Methods retain these colors even when another factor determines line style.
[methods.none]
color = "blue"
marker = "o"
linestyle = "--"

[methods.sd]
color = "vermilion"
marker = "s"
linestyle = "-"

[methods.damped]
color = "green"
marker = "^"
linestyle = "-."

[methods.variance]
color = "purple"
marker = "D"
linestyle = ":"

[validation.aggregate]
color = "charcoal"
marker = "o"
linestyle = "-"

[validation.rare]
color = "purple"
marker = "s"
linestyle = "-"

# Each figure retains its own scaled-budget definition in the labels.
[budgets."1"]
color = "viridis_low"
marker = "o"
linestyle = ":"

[budgets."2"]
color = "viridis_mid"
marker = "s"
linestyle = "--"

[budgets."4"]
color = "viridis_high"
marker = "^"
linestyle = "-"

[prevalences."0.02"]
color = "plasma_high"
marker = "o"
linestyle = "-"

[prevalences."0.0001"]
color = "plasma_low"
marker = "s"
linestyle = "--"

[prevalences."0.0002"]
color = "plasma_mid"
marker = "s"
linestyle = "-"

[prevalences."0.000002"]
color = "plasma_low"
marker = "^"
linestyle = "-"

[arms.fresh]
color = "charcoal"
marker = "o"
linestyle = "-"

[arms.reuse]
color = "orange"
marker = "s"
linestyle = "--"

[arms.reuse_mean_initialized]
color = "sky_blue"
marker = "^"
linestyle = "-."

[components.incomplete_learning]
color = "charcoal"

[components.feature_sampling]
color = "orange"

[components.observation_noise]
color = "sky_blue"

[clipping.raw]
color = "charcoal"
marker = "o"

[clipping.clipped]
color = "green"
marker = "s"

# Secondary factors use line style, fill, or shape rather than extra colors.
[searches.original]
linestyle = ":"
fillstyle = "none"

[searches.expanded]
linestyle = "-"
fillstyle = "full"

[intercepts.known]
linestyle = "--"

[intercepts.centered_fitted]
linestyle = "-"

[sample_sizes."256"]
marker = "o"

[sample_sizes."2048"]
marker = "s"
